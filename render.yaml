databases:
  - name: quoteflow-db
    databaseName: quoteflow
    user: quoteflow
    plan: free

services:

  # Web service: FastAPI application
  - type: web
    name: quoteflow-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: FEEDBACK_API_KEY
        generateValue: true
      - key: EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quoteflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quoteflow-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AGENT_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: BUSINESS_NAME
        value: QuoteFlow AI

  # Background worker: Celery for async image processing
  - type: worker
    name: quoteflow-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_tasks.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: FEEDBACK_API_KEY
        fromService:
          type: web
          name: quoteflow-api
          envVarKey: FEEDBACK_API_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: quoteflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quoteflow-redis
          property: connectionString
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: quoteflow-api
          envVarKey: OPENAI_API_KEY
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AGENT_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BUSINESS_NAME
        value: QuoteFlow AI

  # Redis for Celery task queue
  - type: keyvalue
    name: quoteflow-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  # Celery Beat scheduler for automated follow-ups
  - type: worker
    name: quoteflow-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_tasks.celery_app beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quoteflow-redis
          property: connectionString
