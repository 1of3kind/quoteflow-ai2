# Render production blueprint (MUST-FIX #3/#4).
# All instances are PAID tiers — Render free Postgres expires after 30 days
# with no backups and free Key Value loses data on restart; this blueprint
# must never be used to serve paying customers on free instances.
databases:
  - name: ezflow-db
    databaseName: ezflow
    user: ezflow
    plan: 0.1c-256mb         # paid: persistent storage + automated backups
    postgresMajorVersion: "16"

services:

  # Web service: FastAPI application
  - type: web
    name: ezflow-api
    runtime: python
    plan: 0.5c-512mb          # paid
    healthCheckPath: /health
    buildFilter:
      paths: ["**"]
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: APP_ENV
        value: production     # MUST-FIX #4: unambiguous production intent
      - key: JWT_SECRET
        generateValue: true   # MUST-FIX #4: strong random secret at deploy time
      - key: FEEDBACK_API_KEY
        generateValue: true
      - key: EMAIL_WEBHOOK_SECRET
        generateValue: true
      # CORS MUST list the real frontend origin — the app refuses to boot in
      # production with a wildcard (MUST-FIX #5).
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ezflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ezflow-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      # Enables LLM parsing in the assistant. Safe to leave on: core.assistant
      # falls back to the rules parser whenever OPENAI_API_KEY is unset.
      - key: ASSISTANT_USE_LLM
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AGENT_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_ANNUAL
        sync: false
      # Interim: email delivery is not configured yet, so verification emails
      # cannot be delivered. FLIP TO true once SENDGRID_API_KEY + a verified
      # sender domain are set — required before serving real customers.
      - key: REQUIRE_VERIFIED_EMAIL
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: info

  # Background worker: Celery for async image processing
  - type: worker
    name: ezflow-worker
    runtime: python
    plan: 0.5c-512mb          # paid
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_tasks.celery_app worker --loglevel=info --concurrency 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FEEDBACK_API_KEY
        fromService:
          type: web
          name: ezflow-api
          envVarKey: FEEDBACK_API_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ezflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ezflow-redis
          property: connectionString
      # Optional at runtime (mock analyzer without it) — set independently on
      # the worker; do NOT fromService-copy ezflow-api's value, because that
      # fails blueprint sync while the variable is unset on the api service.
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AGENT_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BUSINESS_NAME
        value: E-ZFlow

  # Redis for Celery task queue
  - type: keyvalue
    name: ezflow-redis
    ipAllowList: []
    plan: 256mb               # paid: persistent, survives restarts
    maxmemoryPolicy: noeviction

  # Celery Beat scheduler for automated follow-ups
  - type: worker
    name: ezflow-scheduler
    runtime: python
    plan: 0.5c-512mb          # paid
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_tasks.celery_app beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ezflow-redis
          property: connectionString
